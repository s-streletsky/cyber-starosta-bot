[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "mypy==1.11.2",
    "tzdata==2026.4; sys_platform == 'win32'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
files = [
    "storage.py",
    "services",
    "handlers",
    "keyboards",
    "bot.py",
    "config.py",
    "callbacks.py",
    "texts.py",
]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# aiogram presentation-layer: Message|InaccessibleMessage, Bot|None unions and
# BaseMiddleware override are TelegramObject-specific; core logic
# (storage, services, keyboards, bot, config) stays fully checked.
module = ["handlers.*"]
ignore_errors = true
